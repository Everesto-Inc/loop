name: 'Loop · vulnerable dependencies (Trivy)'
description: Fails on fixable CRITICAL/HIGH vulnerabilities in dependency files. Exceptions go in .trivyignore.
inputs:
  severity: { description: Severities that fail the build, default: 'CRITICAL,HIGH' }
  mode: { description: 'enforce (fail on findings) | report (show only, never fail)', default: enforce }
runs:
  using: composite
  steps:
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with: { scan-type: fs, scan-ref: ., severity: '${{ inputs.severity }}', ignore-unfixed: true, exit-code: "${{ inputs.mode == 'report' && '0' || '1' }}" }
    - if: inputs.mode == 'report'
      shell: bash
      run: echo "::warning::Trivy (dependencies) in REPORT mode — findings do not fail the build" 
