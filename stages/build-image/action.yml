name: 'Loop · build + scan image (Trivy)'
description: Builds the image for linux/arm64 (QEMU on x86 runners) and scans it with Trivy. The scan is part of the build — it can't be switched off.
inputs:
  image: { description: 'Image without tag, e.g. ghcr.io/everesto-inc/seine-api', required: true }
  context: { description: Build context, default: . }
  dockerfile: { description: Dockerfile path, default: Dockerfile }
  platform: { description: Target platform, default: linux/arm64 }
  build-args: { description: Build args (one per line), default: '' }
  severity: { description: Severities that fail the scan, default: 'CRITICAL,HIGH' }
outputs:
  tag: { description: 'Image tag (sha-<7>)', value: '${{ steps.tag.outputs.tag }}' }
runs:
  using: composite
  steps:
    - id: tag
      shell: bash
      run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
    - if: runner.arch != 'ARM64'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platform }}
        build-args: ${{ inputs.build-args }}
        load: true
        push: false
        tags: ${{ inputs.image }}:${{ steps.tag.outputs.tag }}
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with: { image-ref: '${{ inputs.image }}:${{ steps.tag.outputs.tag }}', severity: '${{ inputs.severity }}', ignore-unfixed: true, exit-code: '1' }
